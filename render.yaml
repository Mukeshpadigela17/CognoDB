services:
  - type: web
    name: jobgraph-cognodb
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false
      - key: PORT
        value: 3000
